<!doctype html>
<!-- The Store's screenshots: render.ps1 loads this page at 1366 x 768 (rendered at 2x) once per shot, named by the
     hash (#promo, #chat, #home). Each is a caption on the left and the real app on the right: the home page
     (src/app/home.html) drawing the state 2B.exe would send it, the terminal demo (docs/demo.svg) stopped at a
     moment, or a capture of the Chat page (chat.png). Needs Edge's --allow-file-access-from-files, to read those
     files from file://. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
  html, body { width: 1366px; height: 768px; }
  /* The dots fade out behind the window. */
  body::before { mask-image: linear-gradient(90deg, #000 0%, rgba(0, 0, 0, 0.6) 30%, transparent 55%); }

  .caption { position: absolute; left: 60px; top: 0; bottom: 0; width: 330px; display: flex; flex-direction: column; justify-content: center; }
  .caption .app { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; font-size: 19px; font-weight: 600; }
  .caption .app img { width: 44px; height: 44px; }
  .caption .app small { display: block; margin-top: 1px; font-size: 14px; font-weight: 400; color: rgba(255, 255, 255, 0.7); }
  h1 { margin: 0; font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
  .caption p { margin: 20px 0 0; font: 400 17px/1.5 "Segoe UI Variable Text", "Segoe UI", sans-serif; color: rgba(255, 255, 255, 0.78); }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
  /* #promo: the size, big, over a 16 GB flash drive filled to it; then the other numbers. */
  .size { margin-top: 34px; width: 310px; }
  .size b { display: block; width: max-content; font-size: 58px; line-height: 1; font-weight: 700; letter-spacing: -0.03em; }
  /* The size as a bar: a 16 GB drive, filled to it. */
  .drive { position: relative; height: 30px; margin: 16px 0 0; border-radius: 6px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.25); }
  .drive i { position: absolute; left: 3px; top: 3px; bottom: 3px; border-radius: 3px; background: var(--brand); }
  .scale { display: flex; justify-content: space-between; margin: 8px 0 0; font: 400 14px "Segoe UI Variable Text", "Segoe UI", sans-serif; color: rgba(255, 255, 255, 0.78); }
  .stats { display: flex; gap: 30px; margin-top: 30px; }
  .stats b { display: block; font-size: 28px; line-height: 1.1; font-weight: 700; }
  .stats span { font: 400 13px/1.4 "Segoe UI Variable Text", "Segoe UI", sans-serif; color: rgba(255, 255, 255, 0.7); }
  /* #home: the GPUs, by verdict: each verdict in its color, each GPU outlined in the brand gradient. */
  .tier { margin-top: 22px; }
  .verdict { display: flex; align-items: baseline; gap: 8px; font: 700 15px "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  .verdict b { font-weight: inherit; }
  .verdict.great b { background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .verdict.good b { color: #f07fa3; }
  .verdict.slow b { color: #e8b25a; }
  .verdict span { font-weight: 400; font-size: 14px; color: rgba(255, 255, 255, 0.6); }
  .gpus { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .gpus span {
    padding: 4px 10px; border-radius: 999px; font: 600 12px "Segoe UI Variable Text", "Segoe UI", sans-serif;
    border: 1px solid transparent;
  }
  /* One gradient across the caption column (fixed to the page), not one per chip, so neighbours blend. */
  .gpus span {
    background: linear-gradient(#2a211c, #2a211c) padding-box, var(--brand) border-box;
    background-attachment: scroll, fixed; background-size: auto, 330px 100%; background-position: 0 0, 60px 0;
  }
  .facts span {
    padding: 6px 13px; border-radius: 999px; font: 600 13px "Segoe UI Variable Text", "Segoe UI", sans-serif;
    background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
  }

  /* The window, at the app's own size (940 x 680, app.cs), scaled to the height of the shot. */
  .window {
    position: absolute; right: 44px; top: 50%; transform-origin: right center; transform: translateY(-50%) scale(0.95);
    width: 940px; border-radius: 9px; overflow: hidden; background: var(--bg);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14), 0 32px 80px rgba(0, 0, 0, 0.55), 0 10px 24px rgba(0, 0, 0, 0.3);
  }
  /* A Windows 11 title bar, with the icon and title 2B.exe and its terminal both set. */
  .titlebar { height: 32px; display: flex; align-items: center; background: #f3efe8; color: #1b1b1b; font: 12px "Segoe UI", sans-serif; }
  .titlebar img { width: 16px; height: 16px; margin: 0 10px 0 12px; }
  .titlebar span { flex: 1; }
  .titlebar i { width: 46px; text-align: center; font: normal 10px "Segoe Fluent Icons", "Segoe MDL2 Assets"; }
  .client { display: block; width: 940px; height: 680px; border: 0; background: var(--bg); }
  /* demo.svg without its own title bar; a line cut by the top of its screen fades out. */
  svg.client { height: 685px; mask-image: linear-gradient(transparent 0, #000 36px); }
</style>
</head>
<body>
  <div class="caption">
    <div class="app"><img src="../src/app/icon.svg" alt=""><span>Agent 2B<small>AI in Your Flash Drive</small></span></div>
    <h1 id="title"></h1>
    <p id="text"></p>
    <div class="facts" id="facts"></div>
    <div id="numbers"></div>
  </div>
  <div class="window">
    <div class="titlebar"><img src="../src/app/icon.svg" alt=""><span>Agent 2B</span><i>&#xE921;</i><i>&#xE922;</i><i>&#xE8BB;</i></div>
  </div>

<script>
// What 2B.exe sends the home page on this developer's PC (an RTX 5060 Laptop GPU with 8 GB and 16 GB of RAM), as in
// app.cs; the plan is llama-fit-params' for it.
const MODEL = { name: "GPT OSS 20B", size: 12109566624, parameters: "20.9", license: "Apache-2.0", need: 12109566624, free: 412e9, drive: "C:" };
const SYSTEM = { name: "NVIDIA GeForce RTX 5060 Laptop GPU", vram: 8, ram: 16, cuda: "12.8", verdict: "good", reason: null };
const READY = {
  version: "1.0.0", system: SYSTEM, model: { ...MODEL, ready: true }, download: null,
  server: { state: "ready", plan: { context: 65536, gpu: 5896, ram: 7673 } }, error: null,
};

// The promo shots' numbers. build\Agent 2B plus the model: 13.8 GB (12.8 GiB), so it fits a 16 GB stick.
const NUMBERS = `
      <div class="size">
        <b class="brand">14 GB</b>
        <div class="drive"><i style="width: calc(13.8 / 16 * (100% - 6px))"></i></div>
        <div class="scale"><span>The model and all its tools</span><span>16 GB</span></div>
      </div>
      <div class="stats">
        <div><b>20.9&nbsp;B</b><span>total<br>parameters</span></div>
        <div><b>64&nbsp;k</b><span>tokens of<br>context</span></div>
        <div><b>$0</b><span>no cloud, no<br>account, no API key</span></div>
      </div>`;

// Popular GPUs by the verdict 2B's check gives them (Requirements in app.cs), with 16 GB of RAM: Great is 16 GB of
// VRAM or more, Good is an RTX with 8 to 12 GB, Slow is 6 GB or a GTX 10-series (no tensor cores).
const GPUS = [
  ["great", "Great", "the whole model on the GPU", ["RTX 5090", "RTX 5080", "RTX 5070 Ti", "RTX 5060 Ti 16 GB", "RTX 4090", "RTX 4080", "RTX 4070 Ti Super", "RTX 4060 Ti 16 GB", "RTX 3090"]],
  ["good", "Good", "desktop and laptop", ["RTX 5070", "RTX 5060", "RTX 4070", "RTX 4060", "RTX 3080", "RTX 3070", "RTX 3060 12 GB", "RTX 2080", "RTX 2070", "RTX 2060 Super"]],
  ["slow", "Slow", "works, replies come slower", ["RTX 2060", "GTX 1660", "GTX 1080 Ti", "GTX 1080", "GTX 1070", "GTX 1060 6 GB"]],
].map(([tier, verdict, note, names]) => `
  <div class="tier ${tier}"><div class="verdict ${tier}"><b>${verdict}</b><span>${note}</span></div>
  <div class="gpus">${names.map(n => `<span>${n}</span>`).join("")}</div></div>`).join("");

// Each shot: its caption, and what's in the window: a home page state, the demo at a time (s), or an image of the
// window's contents at 940 x 680 (chat.png: a capture of the real Chat page, at 2x).
const SHOTS = {
  promo: {
    title: 'An AI coding agent fits into <span class="brand">your own flash drive.</span>',
    numbers: NUMBERS,
    demo: 10,
  },
  chat: {
    title: 'An AI chatbot fits into <span class="brand">your own flash drive.</span>',
    numbers: NUMBERS,
    image: "chat.png",
  },
  home: {
    title: 'Runs on <span class="brand">your gaming PC.</span>',
    text: "No pricey workstation or data-center card. The GeForce you game on is enough, and 2B fits the model to it.",
    numbers: GPUS,
    home: READY,
  },
};

const shot = SHOTS[location.hash.slice(1)];
if (!shot) throw new Error("Unknown shot " + location.hash);
document.getElementById("title").innerHTML = shot.title;
document.getElementById("text").textContent = shot.text || "";
if (!shot.text) document.getElementById("text").remove();
document.getElementById("numbers").innerHTML = shot.numbers || "";
document.getElementById("facts").innerHTML = (shot.facts || []).map(f => `<span>${f}</span>`).join("");
const win = document.querySelector(".window");

if (shot.image) {
  win.insertAdjacentHTML("beforeend", `<img class="client" src="${shot.image}" alt="">`);
} else if (shot.home) {
  const frame = document.createElement("iframe");
  frame.className = "client";
  frame.src = "../src/app/home.html";
  frame.onload = () => frame.contentWindow.render(shot.home);
  win.append(frame);
} else {
  // The demo, stopped at its time, without its own (macOS-style) title bar: the window has one.
  fetch("../docs/demo.svg").then(r => r.text()).then(text => {
    win.insertAdjacentHTML("beforeend", text);
    const svg = win.querySelector("svg");
    svg.classList.add("client");
    svg.setAttribute("viewBox", "0 35 940 685");
    svg.querySelectorAll(":scope > rect, :scope > circle, :scope > .ttl").forEach(e => e.remove());
    svg.getAnimations({ subtree: true }).forEach(a => { a.pause(); a.currentTime = shot.demo * 1000; });
  });
}
</script>
</body>
</html>
