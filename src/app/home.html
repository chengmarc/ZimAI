<!doctype html>
<!-- The home page 2B.exe shows (app.cs): the GPU, the model, and the two ways in. It only draws the state 2B.exe
     sends it, and sends back the name of what was clicked ("download" and so on). Its colors are palette.css's. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent 2B</title>
<link rel="stylesheet" href="palette.css">
<style>
  :root {
    --brand: linear-gradient(90deg, var(--gold), var(--rose) 55%, var(--violet));
    /* The cards' shadows, in --strong's warm brown rather than grey: resting, and lifted under the pointer */
    --shadow: 0 1px 2px rgba(61, 52, 43, 0.05), 0 4px 14px rgba(61, 52, 43, 0.06);
    --shadow-lift: 0 2px 4px rgba(61, 52, 43, 0.06), 0 10px 24px rgba(61, 52, 43, 0.10);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--strong);
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 24px 20px; user-select: none; overflow-y: auto;
  }
  main { width: 100%; max-width: 640px; flex: 1; display: flex; flex-direction: column; gap: 22px; }

  header { display: flex; align-items: center; gap: 18px; }
  header img { width: 72px; height: 72px; }
  h1 { margin: 0; font: 650 28px/1.15 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; letter-spacing: -0.01em; }
  h1 span { background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { margin: 4px 0 0; color: var(--muted); }
  header .switch { margin-left: auto; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .row { display: grid; grid-template-columns: 70px 1fr auto; align-items: center; gap: 4px 14px; padding: 14px 18px; }
  .row + .row { border-top: 1px solid var(--line); }
  .label { color: var(--faint); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .value { min-width: 0; }
  .value b { font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }

  .bar { grid-column: 2 / 4; height: 6px; border-radius: 3px; background: #ece4d6; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--brand); border-radius: 3px; transition: width 0.4s; }
  .bar.sweep i { width: 30%; animation: sweep 1.4s ease-in-out infinite alternate; }
  @keyframes sweep { from { margin-left: 0; } to { margin-left: 70%; } }

  .side { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px; border-radius: 999px; white-space: nowrap;
    font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); background: var(--bg);
  }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 25%, var(--bg)); background: color-mix(in srgb, var(--ok) 7%, var(--bg)); }
  .pill.busy { color: var(--rose); border-color: color-mix(in srgb, var(--rose) 25%, var(--bg)); background: color-mix(in srgb, var(--rose) 7%, var(--bg)); }
  .pill.busy::before { animation: pulse 0.9s ease-in-out infinite alternate; }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 25%, var(--bg)); background: color-mix(in srgb, var(--warn) 7%, var(--bg)); }
  .pill.off { color: var(--faint); background: transparent; }
  .hint { grid-column: 2 / 4; color: var(--muted); font-size: 13px; }
  .btn:disabled { opacity: 0.45; cursor: default; filter: none; }
  .switch {
    display: inline-flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; white-space: nowrap;
    color: var(--muted); font-size: 14px; font-weight: 600;
  }
  .switch i { width: 44px; height: 26px; border-radius: 13px; background: #ddd2c2; position: relative; transition: background 0.15s; }
  .switch i::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(61, 52, 43, 0.3); transition: left 0.15s;
  }
  .switch[aria-checked="true"] i { background: var(--brand); }
  .switch[aria-checked="true"] i::after { left: 21px; }
  .pill.off::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
  @keyframes pulse { from { opacity: 1; } to { opacity: 0.25; } }

  button { font: inherit; cursor: pointer; }
  .btn {
    padding: 7px 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--strong);
    font-weight: 600; white-space: nowrap;
  }
  .btn:hover { background: #f3ece1; }
  .btn.primary { border: 0; color: #fff; background: var(--brand); padding: 8px 18px; }
  .btn.primary:hover { filter: brightness(1.06); }

  .ways { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .way {
    text-align: left; padding: 20px 20px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
    color: var(--strong); display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden;
    box-shadow: var(--shadow); transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  .way::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--brand); opacity: 0; transition: opacity 0.15s; }
  .way:hover:not(:disabled) { border-color: #d4c6b0; box-shadow: var(--shadow-lift); transform: translateY(-1px); }
  .way:hover:not(:disabled)::before { opacity: 1; }
  .way:disabled { cursor: default; opacity: 0.5; }
  .way svg { width: 26px; height: 26px; color: var(--rose); }
  .way strong { font-size: 17px; font-weight: 650; }
  .way span { color: var(--muted); font-size: 13px; }
  .way .bar { margin-top: 6px; }

  .error {
    border: 1px solid #ebc0b8; background: #fbefea; color: var(--bad); border-radius: 10px; padding: 10px 14px;
    display: flex; gap: 12px; align-items: flex-start; justify-content: space-between;
  }
  .error button { border: 0; background: none; color: var(--bad); text-decoration: underline; padding: 0; }

  footer { width: 100%; max-width: 640px; display: flex; gap: 18px; color: var(--faint); font-size: 12px; padding-top: 18px; }
  footer button { border: 0; background: none; padding: 0; color: var(--muted); }
  footer button:hover { color: var(--strong); text-decoration: underline; }
  footer .spacer { flex: 1; }

  @media (max-width: 560px) {
    .ways { grid-template-columns: 1fr; }
    .row { grid-template-columns: 1fr auto; }
    .row .label { grid-column: 1 / 3; }
    .bar { grid-column: 1 / 3; }
  }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon.svg" alt="">
    <div>
      <h1>Agent <span>2B</span></h1>
      <p>A coding agent that runs on your own PC.</p>
    </div>
    <button class="switch" id="use-gpu" role="switch" aria-checked="true" hidden><i></i>Use GPU</button>
  </header>

  <div id="error" class="error" hidden><span id="error-text"></span><button id="error-log">Server log</button></div>

  <section class="card">
    <div class="row">
      <div class="label">System</div>
      <div class="value" id="system"></div>
      <div class="side" id="system-side"></div>
      <div class="hint" id="system-hint" hidden></div>
    </div>
    <div class="row">
      <div class="label">Model</div>
      <div class="value" id="model"></div>
      <div class="side" id="model-side"></div>
      <div class="bar" id="download-bar" hidden><i></i></div>
      <div class="hint" id="model-hint" hidden></div>
    </div>
    <div class="row">
      <div class="label">Server</div>
      <div class="value" id="server"></div>
      <div class="side" id="server-side"></div>
      <div class="bar" id="server-bar" hidden><i></i></div>
    </div>
  </section>

  <section class="ways">
    <button class="way" id="chat" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
      <strong>Chat</strong>
      <span>Talk with the model, here in this window.</span>
    </button>
    <button class="way" id="terminal" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 9l3 3-3 3M12.5 15H17"/></svg>
      <strong>Terminal</strong>
      <span>The coding agent in Git Bash: it reads, edits and runs things in your projects.</span>
    </button>
  </section>
</main>
<footer>
  <button id="folder">Data folder</button>
  <button id="log">Server log</button>
  <span class="spacer"></span>
  <span>Everything runs on this computer.</span>
  <span id="version"></span>
</footer>

<script>
const host = window.chrome && window.chrome.webview;
const send = what => host && host.postMessage(what);
const $ = id => document.getElementById(id);

for (const [id, what] of [["chat", "chat"], ["terminal", "terminal"], ["folder", "folder"], ["log", "log"], ["error-log", "log"],
                          ["use-gpu", "gpu"]]) {
  $(id).addEventListener("click", () => send(what));
}

// Sizes as Windows shows them: a GB is 1024³ bytes, cut (not rounded) to the digits shown, and a narrow no-break
// space before the unit.
const GIB = 2 ** 30, THIN = "&#8239;";
const cut = (n, digits) => (Math.floor(n * 10 ** digits) / 10 ** digits).toFixed(digits);
const gb = (n, digits = 1) => cut(n / GIB, digits) + THIN + "GB";
function eta(seconds) {
  if (!isFinite(seconds) || seconds <= 0) return "";
  if (seconds < 90) return Math.round(seconds) + " s left";
  if (seconds < 5400) return Math.round(seconds / 60) + " min left";
  return (seconds / 3600).toFixed(1) + " h left";
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function button(label, what, primary) {
  const b = document.createElement("button");
  b.className = "btn" + (primary ? " primary" : "");
  b.textContent = label;
  b.onclick = () => send(what);
  return b;
}

/** The model, as 2B.exe describes it (Model in app.cs): "GPT OSS 20B · 11.27 GB · 20.9 B Parameters · Apache-2.0". */
function about(model) {
  return `<b>${esc(model.name)}</b> <span class="sub">&middot; ${gb(model.size, 2)} &middot; ` +
    `${esc(model.parameters)}${THIN}B Parameters &middot; ${esc(model.license)}</span>`;
}

// Each row's status: "ok" (ready), "busy" (loading), "warn" (works, with a catch) or "off" (not ready).
const pill = (cls, text) => `<span class="pill ${cls}">${text}</span>`;
const hint = (id, text) => { $(id).hidden = !text; $(id).textContent = text || ""; };

// The System row's pill for each of 2B.exe's verdicts (Requirements in app.cs).
const VERDICTS = {
  great: ["ok", "Great"], good: ["ok", "Good"], slow: ["warn", "Slow"], cpu: ["warn", "Slow"],
  unsupported: ["off", "Not Supported"],
};

function render(s) {
  $("version").textContent = "v" + s.version;

  // System: whether this PC can run 2B, known before the download
  const sys = s.system;
  if (!sys) {
    $("system").innerHTML = '<span class="sub">Checking this PC...</span>';
    $("system-side").innerHTML = pill("busy", "Checking");
  } else {
    // Only what decides how 2B runs, not the PC's spec: whether it has a GPU it can run on, the memory, and CUDA.
    // A GPU it can't run on (too old, too little VRAM, an old driver), or Use GPU off, is CPU Only; the hint says why.
    $("system").innerHTML = sys.gpuUsable && sys.useGpu
      ? `<b>GPU Available</b> <span class="sub">&middot; ${sys.ram}${THIN}GB RAM + ${sys.vram}${THIN}GB VRAM` +
        (sys.cuda ? ` &middot; CUDA ${esc(sys.cuda)}` : "") + "</span>"
      : `<b>CPU Only</b> <span class="sub">&middot; ${sys.ram}${THIN}GB RAM</span>`;
    const [cls, text] = VERDICTS[sys.verdict];
    $("system-side").innerHTML = pill(cls, text);
  }
  // Use GPU, top right: on by default, and there only with a GPU the model can run on
  const toggle = $("use-gpu");
  toggle.hidden = !sys || !sys.gpuUsable;
  if (sys) toggle.setAttribute("aria-checked", sys.useGpu);
  hint("system-hint", sys && sys.reason);
  const supported = !!sys && ["great", "good", "slow", "cpu"].includes(sys.verdict);

  // Model
  const d = s.download, modelSide = $("model-side"), bar = $("download-bar"), model = $("model");
  modelSide.replaceChildren();
  bar.hidden = true;
  if (s.model.ready) {
    model.innerHTML = about(s.model);
    modelSide.innerHTML = pill("ok", "Ready");
  } else if (d && d.active) {
    const pct = d.total ? (100 * d.done / d.total) : 0;
    const speed = d.speed > 0 ? ` &middot; ${(d.speed / 1e6).toFixed(0)} MB/s &middot; ${eta((d.total - d.done) / d.speed)}` : "";
    model.innerHTML = `<b>${esc(s.model.name)}</b> <span class="sub">&middot; ${Math.floor(pct)}% &middot; ` +
      `${cut(d.done / GIB, 1)} / ${gb(d.total)}${speed}</span>`;
    bar.hidden = false;
    bar.firstChild.style.width = pct.toFixed(1) + "%";
    modelSide.append(button("Cancel", "cancel"));
  } else {
    const resume = d && d.done > 0;
    // No model, so nothing about it: only what happened to the download, if anything
    model.innerHTML = '<b>No Model Detected</b> <span class="sub">' +
      (d && d.error ? ` &middot; <span class="bad">${esc(d.error)}</span>` : resume ? ` &middot; ${gb(d.done)} downloaded` : "") +
      "</span>";
    if (resume) {
      bar.hidden = false;
      bar.firstChild.style.width = (100 * d.done / d.total).toFixed(1) + "%";
    }
    // Download only once the PC is known to run it, and the disk has room (2B.exe checks both too)
    const room = s.model.free >= s.model.need;
    const get = button(resume ? "Resume" : "Download", "download", true);
    get.disabled = !supported || !room;
    modelSide.append(get);
  }
  hint("model-hint", !s.model.ready && !(d && d.active) && s.model.free < s.model.need &&
    `The model needs ${gb(s.model.need)} free on drive ${s.model.drive}, which has ${gb(s.model.free)}.`);

  // Server: 2B.exe starts it when the window opens (or once the model is downloaded)
  const sv = s.server, side = $("server-side"), serverBar = $("server-bar");
  side.replaceChildren();
  serverBar.hidden = sv.state !== "loading";
  // How 2B.exe fitted it to this computer: what's in VRAM, what's in RAM (loaded or memory-mapped), and the context
  const p = sv.plan, gib = mib => gb(mib * 2 ** 20);
  let note = !p ? (s.model.ready ? "starts with the window" : "starts once the model is downloaded")
    : `${gib(p.gpu)} in VRAM &middot; ${gib(p.ram)} in RAM &middot; ${Math.round(p.context / 1024)} k Context`;
  if (sv.state === "ready") {
    side.innerHTML = pill("ok", "Ready");
  } else if (sv.state === "loading") {
    const est = sv.estimate;
    note = est ? `loading the model into memory, about ${est} s` : "loading the model into memory; the first time can take a minute";
    side.innerHTML = pill("busy", `Loading &middot; ${sv.seconds} s`);
    serverBar.classList.toggle("sweep", !est);
    serverBar.firstChild.style.width = est ? Math.min(95, 100 * sv.seconds / est).toFixed(0) + "%" : "";
  } else if (s.model.ready) {
    side.innerHTML = pill("off", "Stopped");
    side.append(button("Start", "start", true));
  } else {
    side.innerHTML = pill("off", "Waiting for Model");
  }
  $("server").innerHTML = `<b>llama.cpp</b> <span class="sub">&middot; ${note}</span>`;

  // The two ways in: only once the model is loaded, so they open without a wait
  $("chat").disabled = $("terminal").disabled = sv.state !== "ready";

  // Errors
  $("error").hidden = !s.error;
  $("error-text").textContent = s.error || "";
}

if (host) {
  host.addEventListener("message", e => render(e.data));
  send("hello");
}
</script>
</body>
</html>
