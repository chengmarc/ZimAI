# The terminal's look: 2B.exe passes this to mintty with -c, so it wins over ~/.minttyrc. The colors are
# palette.css's: --ink text on the --bg background, and --bad, --ok and --warn for red, green and yellow.
ThemeFile=
ForegroundColour=46,38,30
BackgroundColour=251,248,243
CursorColour=46,38,30
# The agent's red, green and yellow: mintty's defaults are made for a dark background.
# Full saturation, dark enough to read on the warm white (contrast 4.5+).
Red=180,20,20
Green=0,125,40
Yellow=155,100,0
BoldRed=195,25,25
BoldGreen=0,135,45
BoldYellow=165,105,0
# Consolas comes with every Windows.
Font=Consolas
FontWeight=700
FontHeight=14
# The title stays "Agent 2B" (2B.exe sets it with -t): ignore the escape codes programs set titles with,
# e.g. Git Bash's prompt, which would show MINGW64:/current/folder.
SuppressOSC=0,1,2
# Closing the window doesn't ask first ("processes are running"); a 2b in it still stops its server.
ConfirmExit=no
