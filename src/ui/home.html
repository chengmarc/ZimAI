<!doctype html>
<!-- The home page ZimAI.exe shows (app/Window.cs): the GPU, the model, and the two ways in. It only draws the state ZimAI.exe
     sends it, and sends back the name of what was clicked ("download" and so on). Its colors are palette.css's. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZimAI</title>
<link rel="stylesheet" href="palette.css">
<style>
  :root {
    --brand: linear-gradient(90deg, var(--gold), var(--rose) 55%, var(--violet));
    /* The cards' shadows, in --strong's warm brown rather than grey: resting, and lifted under the pointer */
    --shadow: 0 1px 2px rgba(61, 52, 43, 0.05), 0 4px 14px rgba(61, 52, 43, 0.06);
    --shadow-lift: 0 2px 4px rgba(61, 52, 43, 0.06), 0 10px 24px rgba(61, 52, 43, 0.10);
    /* Light, as the icon's loop gives off: what glows (the bars, the switch, a card under the pointer) */
    --glow: 0 0 10px color-mix(in srgb, var(--rose) 45%, transparent);
    --glow-lift: 0 2px 4px rgba(61, 52, 43, 0.05), 0 10px 28px color-mix(in srgb, var(--rose) 16%, transparent),
                 0 4px 18px color-mix(in srgb, var(--violet) 12%, transparent);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    /* The icon's tile on the page's paper: its corner glows, amber top left, rose top right, violet bottom right */
    background:
      radial-gradient(65% 60% at 0% 0%, color-mix(in srgb, var(--gold) 36%, transparent), transparent),
      radial-gradient(55% 55% at 100% 0%, color-mix(in srgb, var(--rose) 28%, transparent), transparent),
      radial-gradient(70% 65% at 100% 100%, color-mix(in srgb, var(--violet) 36%, transparent), transparent),
      var(--bg);
    background-attachment: fixed;
    color: var(--strong);
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 24px 20px; user-select: none; overflow-y: auto;
  }
  main { width: 100%; max-width: 640px; flex: 1; display: flex; flex-direction: column; gap: 22px; }

  header { display: flex; align-items: center; gap: 18px; }
  header img { width: 72px; height: 72px; filter: drop-shadow(0 6px 14px color-mix(in srgb, var(--violet) 30%, transparent)); }
  h1 { margin: 0; font: 650 28px/1.15 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; letter-spacing: -0.01em; }
  h1 span { background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { margin: 4px 0 0; color: var(--muted); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .row { display: grid; grid-template-columns: 70px 1fr auto; align-items: center; gap: 4px 14px; padding: 14px 18px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row.later > * { opacity: 0.5; }   /* a step that waits on the one above it */
  .label { color: var(--faint); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .value { min-width: 0; }
  .value b { font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }

  /* The one progress bar, under the ways in: the download, or the server loading. Made like the cards
     (their paper, line and shadow) and filled with the brand's glow. Idle, it keeps its place, so nothing moves. */
  .bar {
    height: 12px; padding: 2px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .bar.idle { visibility: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--brand); border-radius: 999px; box-shadow: var(--glow); transition: width 0.4s; }
  .bar.sweep i { width: 30%; animation: sweep 1.4s ease-in-out infinite alternate; }
  @keyframes sweep { from { margin-left: 0; } to { margin-left: 70%; } }

  /* As tall as a button, whatever is in it (the switch, nothing), so the rows are all one height */
  .side { display: flex; align-items: center; gap: 10px; justify-content: flex-end; min-height: 34px; }
  .hint { grid-column: 2 / 4; color: var(--muted); font-size: 13px; }
  .btn:disabled { opacity: 0.45; cursor: default; filter: none; }
  .switch {
    display: inline-flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; white-space: nowrap;
    color: var(--muted); font-size: 14px; font-weight: 600;
  }
  .switch i { width: 44px; height: 26px; border-radius: 13px; background: #ddd2c2; position: relative; transition: background 0.15s; }
  .switch i::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(61, 52, 43, 0.3); transition: left 0.15s;
  }
  .switch[aria-checked="true"] i { background: var(--brand); box-shadow: var(--glow); }
  .switch[aria-checked="true"] i::after { left: 21px; }

  button { font: inherit; cursor: pointer; }
  .btn {
    height: 34px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--strong);
    font-weight: 600; white-space: nowrap;
  }
  .btn:hover { background: #f3ece1; }
  .btn.primary { border: 0; color: #fff; background: var(--brand); padding: 0 18px; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.06); box-shadow: var(--glow); }

  .ways { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .way {
    text-align: left; padding: 20px 20px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
    color: var(--strong); display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden;
    box-shadow: var(--shadow); transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  .way::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--brand); opacity: 0; transition: opacity 0.15s; }
  .way:hover:not(:disabled) { border-color: color-mix(in srgb, var(--rose) 30%, var(--line)); box-shadow: var(--glow-lift); transform: translateY(-1px); }
  .way:hover:not(:disabled)::before { opacity: 1; }
  .way:disabled { cursor: default; opacity: 0.5; }
  /* Drawn in the icon's gradient (#way-ink, below), glowing a little */
  .way svg { width: 26px; height: 26px; stroke: url(#way-ink); filter: drop-shadow(0 0 4px color-mix(in srgb, var(--rose) 35%, transparent)); }
  .way strong { font-size: 17px; font-weight: 650; }
  /* What to expect, under the progress bar: an icon in the ways' ink, a line in the page's strong text, the detail muted */
  .note { display: flex; gap: 10px; align-items: center; margin-top: -10px; font-size: 13px; color: var(--muted); }
  .note svg { flex: none; width: 18px; height: 18px; stroke: url(#way-ink);
              filter: drop-shadow(0 0 4px color-mix(in srgb, var(--rose) 35%, transparent)); }
  .note b { display: block; color: var(--strong); font-weight: 600; }
  .way span { color: var(--muted); font-size: 13px; }

  .error {
    border: 1px solid #ebc0b8; background: #fbefea; color: var(--bad); border-radius: 10px; padding: 10px 14px;
    display: flex; gap: 12px; align-items: flex-start; justify-content: space-between;
  }
  .error button { border: 0; background: none; color: var(--bad); text-decoration: underline; padding: 0; }

  footer { width: 100%; max-width: 640px; display: flex; gap: 18px; color: var(--faint); font-size: 12px; padding-top: 18px; }
  footer button { border: 0; background: none; padding: 0; color: var(--muted); }
  footer button:hover { color: var(--strong); text-decoration: underline; }
  footer .spacer { flex: 1; }

  @media (max-width: 560px) {
    .ways { grid-template-columns: 1fr; }
    .row { grid-template-columns: 1fr auto; }
    .row .label { grid-column: 1 / 3; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position: absolute">
  <linearGradient id="way-ink" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" style="stop-color: var(--gold)"/><stop offset="0.55" style="stop-color: var(--rose)"/><stop offset="1" style="stop-color: var(--violet)"/>
  </linearGradient>
</svg>
<main>
  <header>
    <img src="icon.svg" alt="">
    <div>
      <h1>Zim<span>AI</span></h1>
      <p>Unlimited AI for small jobs, on your own PC.</p>
    </div>
  </header>

  <div id="error" class="error" hidden><span id="error-text"></span><button id="error-log">Server log</button></div>

  <section class="card">
    <div class="row">
      <div class="label">System</div>
      <div class="value" id="system"></div>
      <div class="side">
        <button class="switch" id="use-gpu" role="switch" aria-checked="true" hidden>Use GPU<i></i></button>
      </div>
      <div class="hint" id="system-hint" hidden></div>
    </div>
    <div class="row">
      <div class="label">Model</div>
      <div class="value" id="model"></div>
      <div class="side" id="model-side"></div>
      <div class="hint" id="model-hint" hidden></div>
    </div>
    <div class="row" id="server-row">
      <div class="label">Server</div>
      <div class="value" id="server"></div>
      <div class="side" id="server-side"></div>
    </div>
  </section>

  <section class="ways">
    <button class="way" id="chat" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
      <strong>Chat</strong>
      <span>Talk with the model, here in this window.</span>
    </button>
    <button class="way" id="terminal" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 9l3 3-3 3M12.5 15H17"/></svg>
      <strong>Terminal</strong>
      <span>Hand ZimAI a job in Git Bash: it reads, edits and runs things in your projects.</span>
    </button>
  </section>

  <div class="bar idle" id="progress"><i></i></div>
  <div class="note" id="progress-hint" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5h.01"/></svg>
    <div><b>Loading time depends on your setup</b>About 15 seconds on a fast GPU, up to a few minutes on an older PC or on the CPU.</div>
  </div>
</main>
<footer>
  <button id="folder">Data folder</button>
  <button id="log">Server log</button>
  <span class="spacer"></span>
  <span>Everything runs on this computer.</span>
  <span id="version"></span>
</footer>

<script>
const host = window.chrome && window.chrome.webview;
const send = what => host && host.postMessage(what);
const $ = id => document.getElementById(id);

for (const [id, what] of [["chat", "chat"], ["terminal", "terminal"], ["folder", "folder"], ["log", "log"], ["error-log", "log"],
                          ["use-gpu", "gpu"]]) {
  $(id).addEventListener("click", () => send(what));
}

// Sizes as Windows shows them: a GB is 1024³ bytes, cut (not rounded) to the digits shown, and a narrow no-break
// space before the unit.
const GIB = 2 ** 30, THIN = "&#8239;";
const cut = (n, digits) => (Math.floor(n * 10 ** digits) / 10 ** digits).toFixed(digits);
const gb = (n, digits = 1) => cut(n / GIB, digits) + THIN + "GB";
function eta(seconds) {
  if (!isFinite(seconds) || seconds <= 0) return "";
  if (seconds < 90) return Math.round(seconds) + " s left";
  if (seconds < 5400) return Math.round(seconds / 60) + " min left";
  return (seconds / 3600).toFixed(1) + " h left";
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function button(label, what, primary) {
  const b = document.createElement("button");
  b.className = "btn" + (primary ? " primary" : "");
  b.textContent = label;
  b.onclick = () => send(what);
  return b;
}

/** The model, as ZimAI.exe describes it (app/Model.cs): "11.27 GB · 20.9 B Parameters". */
function about(model) {
  return `${gb(model.size, 2)} &middot; ${esc(model.parameters)}${THIN}B Parameters`;
}

// Each row says its state in its bold words ("Model Ready", "Server Loading"), and its right side holds only what to
// do about it (a button, the Use GPU switch), if anything.
const line = (head, details) => `<b>${head}</b>` + (details ? ` <span class="sub">&middot; ${details}</span>` : "");
const hint = (id, text) => { $(id).hidden = !text; $(id).textContent = text || ""; };

// How the System row words each of ZimAI.exe's verdicts (app/Requirements.cs), and its color.
const VERDICTS = {
  great: ["ok", "Great"], good: ["ok", "Good"], slow: ["warn", "Slow"], cpu: ["warn", "Slow"],
  unsupported: ["bad", "Not Supported"],
};

function render(s) {
  $("version").textContent = "v" + s.version;

  // System: whether this PC can run ZimAI, known before the download
  const sys = s.system, toggle = $("use-gpu");
  // Use GPU: on by default, and there only with a GPU the model can run on. It changes this row, so it's this row's
  // control.
  toggle.hidden = !sys || !sys.gpuUsable;
  if (!sys) {
    $("system").innerHTML = line("Checking This PC");
  } else {
    // Only what decides how ZimAI runs, not the PC's spec: whether it has a GPU it can run on, and the memory.
    // A GPU it can't run on (too old, too little VRAM, an old driver), or Use GPU off, is CPU Only; the hint says why.
    const [cls, text] = VERDICTS[sys.verdict], verdict = ` &middot; <span class="${cls}">${text}</span>`;
    $("system").innerHTML = sys.gpuUsable && sys.useGpu
      ? line("GPU Available", `${sys.ram}${THIN}GB RAM &middot; ${sys.vram}${THIN}GB VRAM` + verdict)
      : line("CPU Only", `${sys.ram}${THIN}GB RAM` + verdict);
    toggle.setAttribute("aria-checked", sys.useGpu);
  }
  hint("system-hint", sys && sys.reason);
  const supported = !!sys && ["great", "good", "slow", "cpu"].includes(sys.verdict);

  // Model
  // The progress bar: how much of the model is downloaded (a number, in %), the server loading ("sweep"), or nothing
  let progress = null;

  const d = s.download, modelSide = $("model-side"), model = $("model");
  modelSide.replaceChildren();
  if (s.model.ready) {
    model.innerHTML = line("Model Ready", about(s.model));
  } else if (d && d.active) {
    const pct = d.total ? (100 * d.done / d.total) : 0;
    const speed = d.speed > 0 ? ` &middot; ${(d.speed / 1e6).toFixed(0)} MB/s &middot; ${eta((d.total - d.done) / d.speed)}` : "";
    model.innerHTML = line("Downloading Model", `${Math.floor(pct)}% &middot; ${cut(d.done / GIB, 1)} / ${gb(d.total)}${speed}`);
    progress = pct;
    modelSide.append(button("Cancel", "cancel"));
  } else {
    const resume = d && d.done > 0;
    // No model, so nothing about it: only what happened to the download, if anything
    model.innerHTML = line("No Model Detected",
      d && d.error ? `<span class="bad">${esc(d.error)}</span>` : resume ? `${gb(d.done)} downloaded` : "");
    if (resume) {
      progress = 100 * d.done / d.total;
    }
    // Download only once the PC is known to run it, and the disk has room (ZimAI.exe checks both too)
    const room = s.model.free >= s.model.need;
    const get = button(resume ? "Resume" : "Download", "download", true);
    get.disabled = !supported || !room;
    modelSide.append(get);
  }
  hint("model-hint", !s.model.ready && !(d && d.active) && s.model.free < s.model.need &&
    `The model needs ${gb(s.model.need)} free on drive ${s.model.drive}, which has ${gb(s.model.free)}.`);

  // Server: started only by its Start button, which appears once the model is downloaded
  const sv = s.server, side = $("server-side");
  side.replaceChildren();
  // How ZimAI.exe fitted it to this computer: what's in RAM (loaded or memory-mapped), what's in VRAM (none on the CPU),
  // and the context, as the System row orders them. The plan is there only while the server runs; without one, what will happen, or that llama.cpp
  // fitted it itself (the dry run failed)
  const p = sv.plan, gib = mib => gb(mib * 2 ** 20);
  let note = p ? `${gib(p.ram)} in RAM &middot; ` + (p.gpu > 0 ? `${gib(p.gpu)} in VRAM &middot; ` : "") +
                 `${Math.round(p.context / 1024)} k Context`
    : !s.model.ready ? "can start once the model is downloaded"
    : sv.state === "ready" ? "fitted to this PC by llama.cpp"
    : "fitted to this PC's free memory when it starts";
  if (sv.state === "loading") {
    note = "loading the model into memory";
    // Back and forth, not filling up: llama.cpp doesn't say how far it is. Under it, the range a load takes.
    progress = "sweep";
  } else if (sv.state === "stopped" && s.model.ready) {
    side.append(button("Start", "start", true));
  }
  // Until the model is there, the server is a later step: dimmed, with nothing to click
  $("server-row").classList.toggle("later", !s.model.ready);
  $("server").innerHTML = line({ ready: "Server Ready", loading: "Server Loading" }[sv.state] || "Server Stopped", note);

  const bar = $("progress");
  bar.classList.toggle("idle", progress === null);
  bar.classList.toggle("sweep", progress === "sweep");
  bar.firstChild.style.width = typeof progress === "number" ? progress.toFixed(1) + "%" : "";
  $("progress-hint").hidden = progress !== "sweep";   // what to expect, while the server loads

  // The two ways in: only once the model is loaded, so they open without a wait
  $("chat").disabled = $("terminal").disabled = sv.state !== "ready";

  // Errors
  $("error").hidden = !s.error;
  $("error-text").textContent = s.error || "";
}

if (host) {
  host.addEventListener("message", e => render(e.data));
  send("hello");
}
</script>
</body>
</html>
