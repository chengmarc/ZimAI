<!doctype html>
<!-- The Store's screenshots: render.ps1 loads this page at 1366 x 768 (rendered at 2x) once per shot, named by the
     hash (#limit, #chat, #home, #terminal). Each is a caption on the left, its line from docs/POSITIONING.md, and the
     real app on the right: the home page (src/ui/home.html) drawing the state ZimAI.exe would send it, the terminal
     demo (docs/demo.svg) stopped at a moment, or a capture of the Chat page (chat-*.png, by chat.ps1). Needs Edge's
     --allow-file-access-from-files, to read those files from file://. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
  html, body { width: 1366px; height: 768px; }
  /* The dots fade out behind the window. */
  body::before { mask-image: linear-gradient(90deg, #000 0%, rgba(0, 0, 0, 0.6) 30%, transparent 55%); }

  .caption { position: absolute; left: 60px; top: 0; bottom: 0; width: 330px; display: flex; flex-direction: column; justify-content: center; }
  .caption .app { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; font-size: 19px; font-weight: 600; }
  .caption .app img { width: 44px; height: 44px; }
  .caption .app small { display: block; margin-top: 1px; font-size: 14px; font-weight: 400; color: rgba(255, 255, 255, 0.7); }
  h1 { margin: 0; font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
  .caption p { margin: 20px 0 0; font: 400 17px/1.5 "Segoe UI Variable Text", "Segoe UI", sans-serif; color: rgba(255, 255, 255, 0.78); }
  /* One row, though it may run a few pixels past the column. */
  .facts { display: flex; gap: 8px; width: max-content; margin-top: 28px; }
  .facts.gpu { margin-top: 10px; }   /* what it needs, on a row of its own */
  /* Every shot: the price, big, and what it means. */
  .size { margin-top: 34px; width: 310px; }
  .size b { display: block; width: max-content; font-size: 116px; line-height: 1; font-weight: 700; letter-spacing: -0.03em; }
  .scale { display: flex; justify-content: space-between; margin: 8px 0 0; font: 400 14px "Segoe UI Variable Text", "Segoe UI", sans-serif; color: rgba(255, 255, 255, 0.78); }
  /* #limit and #chat: the moment it's for, an AI's usage-limit dialog, generic (no product's look or words), over the part of
     the window where it would stop you, and crossed out in the brand gradient. */
  .wall { position: absolute; left: 230px; top: 392px; width: 540px; z-index: 3; transform: rotate(-3deg); }
  .wall-card {
    position: relative; padding: 22px 28px 24px; border-radius: 20px; color: #fff;
    background: linear-gradient(180deg, #2b2724, #1e1b19); border: 1px solid rgba(255, 255, 255, 0.13);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 34px 90px rgba(0, 0, 0, 0.6), 0 10px 26px rgba(0, 0, 0, 0.4);
    font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
  }
  .wall-head { display: flex; align-items: center; gap: 8px; font: 700 12px "Segoe UI", sans-serif; letter-spacing: 0.08em;
               text-transform: uppercase; color: #f2b45a; }
  .wall-head i { font: normal 15px "Segoe Fluent Icons", "Segoe MDL2 Assets"; }
  .wall-card b { display: block; margin-top: 10px; font: 700 31px/1.12 "Segoe UI Variable Display", "Segoe UI", sans-serif;
                 letter-spacing: -0.02em; }
  .meter { margin-top: 18px; }
  .meter-text { display: flex; justify-content: space-between; font-size: 13px; color: rgba(255, 255, 255, 0.6); }
  .meter-text b { display: inline; margin: 0; font: 700 13px "Segoe UI", sans-serif; color: #f07a6a; letter-spacing: 0; }
  .wall-buttons { display: flex; gap: 10px; margin-top: 18px; }
  .wall-buttons span { padding: 9px 18px; border-radius: 10px; font: 600 14px "Segoe UI", sans-serif; }
  .wall-buttons span:first-child { background: #f4efe8; color: #1e1b19; }
  .wall-buttons span:last-child { border: 1px solid rgba(255, 255, 255, 0.22); color: rgba(255, 255, 255, 0.75); }
  /* The cross: two strokes, corner past corner, on top of everything, the dialog's words included. */
  .wall-card::before, .wall-card::after {
    content: ""; position: absolute; left: -7%; right: -7%; top: 50%; height: 12px; margin-top: -6px; border-radius: 6px;
    z-index: 2;
    background: linear-gradient(90deg, var(--gold), var(--rose) 55%, var(--violet));
  }
  .wall-card::before { transform: rotate(21deg); }
  .wall-card::after { transform: rotate(-21deg); }
  .wall-card > * { position: relative; z-index: 1; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.75); }
  .facts span {
    padding: 6px 13px; border-radius: 999px; font: 600 13px "Segoe UI Variable Text", "Segoe UI", sans-serif;
    background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
  }

  /* The window, at the app's own size (960 x 640, app/Window.cs), scaled to clear the caption. */
  .window {
    position: absolute; right: 44px; top: 50%; transform-origin: right center; transform: translateY(-50%) scale(0.95);
    width: 960px; border-radius: 9px; overflow: hidden; background: var(--bg);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14), 0 32px 80px rgba(0, 0, 0, 0.55), 0 10px 24px rgba(0, 0, 0, 0.3);
  }
  /* A Windows 11 title bar, with the icon and title ZimAI.exe and its terminal both set. */
  .titlebar { height: 32px; display: flex; align-items: center; background: #f3efe8; color: #1b1b1b; font: 12px "Segoe UI", sans-serif; }
  .titlebar img { width: 16px; height: 16px; margin: 0 10px 0 12px; }
  .titlebar span { flex: 1; }
  .titlebar i { width: 46px; text-align: center; font: normal 10px "Segoe Fluent Icons", "Segoe MDL2 Assets"; }
  .client { display: block; width: 960px; height: 640px; border: 0; background: var(--bg); }
  /* demo.svg without its own title bar; a line cut by the top of its screen fades out. */
  svg.client { mask-image: linear-gradient(transparent 0, #000 36px); }
</style>
</head>
<body>
  <div class="caption">
    <div class="app"><img src="../../src/ui/icon.svg" alt=""><span>ZimAI<small>Unlimited AI for Small Jobs</small></span></div>
    <h1 id="title"></h1>
    <p id="text"></p>
    <div class="facts" id="facts"></div>
    <div class="facts gpu"><span>Dedicated GPU Preferred</span></div>
    <div class="size">
      <b class="brand">$0</b>
      <div class="scale"><span>No usage limit, no credits, no plan to upgrade</span></div>
    </div>
  </div>
  <div class="window">
    <div class="wall"><div class="wall-card">
      <div class="wall-head"><i>&#xE7BA;</i>Usage limit</div>
      <b>You've reached your usage limit</b>
      <div class="meter">
        <div class="meter-text"><span><b>100%</b> used</span><span>Resets at 4:00 PM</span></div></div>
      <div class="wall-buttons"><span>Upgrade plan</span><span>Wait 4 h 12 m</span></div>
    </div></div>
    <div class="titlebar"><img src="../../src/ui/icon.svg" alt=""><span>ZimAI</span><i>&#xE921;</i><i>&#xE922;</i><i>&#xE8BB;</i></div>
  </div>

<script>
// What ZimAI.exe sends the home page on this developer's PC (an RTX 5060 Laptop GPU with 8 GB and 16 GB of RAM), as in
// app/Window.cs (Push); the plan is the one its server ran with (logs/server-plan).
const MODEL = { name: "GPT OSS 20B", size: 12109566624, parameters: "20.9", license: "Apache-2.0", need: 12109566624, free: 412e9, drive: "C:" };
const SYSTEM = { name: "NVIDIA GeForce RTX 5060 Laptop GPU", vram: 8, ram: 15.7, cuda: "12.8", gpuUsable: true, useGpu: true,
                 verdict: "good", reason: null };
const READY = {
  version: "1.1.0", system: SYSTEM, model: { ...MODEL, ready: true }, download: null,
  server: { state: "ready", plan: { context: 131072, gpu: 5880, ram: 10907, mapped: 1 } }, error: null,
};

// The same on every shot, with the GPU pill and the price (above): what it needs, and what it doesn't.
const FACTS = ["No limits", "Works offline", "No account"];

// Each shot, in upload order: its line (docs/POSITIONING.md), the need it meets in the customer's words, and what's
// in the window: a home page state, the demo at a time (s), or an image of the window's contents at 960 x 640
// (chat-*.png: captures of the real Chat page at 2x, by chat.ps1).
const SHOTS = {
  limit: {
    title: 'Hit your limit? <span class="brand">Keep going.</span>',
    text: "When your AI stops halfway through, ZimAI picks up the job, on your own PC, with no limit of its own.",
    image: "chat-limit.png",
    wall: true,
  },
  chat: {
    title: 'Resets at 4 PM? <span class="brand">Not here.</span>',
    text: "Emails, formulas, rewrites, quick questions: ask as often as you like. Your chats stay on your PC.",
    image: "chat-everyday.png",
    wall: true,
    tilt: 3,   // the other way from shot 1's, so the two don't look copied
  },
  home: {
    title: "Your AI runs out. <span class=\"brand\">Your PC didn't.</span>",
    text: "It runs on your own PC: your GeForce, or just the CPU. ZimAI checks it before downloading, then fits the model to it.",
    home: READY,
    hover: "chat",   // the home page's Chat card, as under the pointer
  },
  terminal: {
    title: 'The AI that never says <span class="brand">come back later.</span>',
    text: "For developers, a terminal that works in your projects. It reads, runs and edits on your PC, asking first.",
    demo: 12.3,
  },
};

// An element of the home page shown as under the pointer: the page's own :hover rules, given to it as a class.
function hover(doc, id) {
  const sheet = [...doc.styleSheets].find(s => s.ownerNode.tagName === "STYLE");
  for (const rule of [...sheet.cssRules]) {
    if (rule.selectorText && rule.selectorText.includes(":hover")) {
      sheet.insertRule(rule.cssText.replaceAll(":hover", ".hover"), sheet.cssRules.length);
    }
  }
  doc.getElementById(id).classList.add("hover");
}

const shot = SHOTS[location.hash.slice(1)];
if (!shot) throw new Error("Unknown shot " + location.hash);
if (!shot.wall) document.querySelector(".wall").remove();
else if (shot.tilt) document.querySelector(".wall").style.transform = `rotate(${shot.tilt}deg)`;
document.getElementById("title").innerHTML = shot.title;
document.getElementById("text").textContent = shot.text || "";
if (!shot.text) document.getElementById("text").remove();
document.getElementById("facts").innerHTML = FACTS.map(f => `<span>${f}</span>`).join("");
const win = document.querySelector(".window");

if (shot.image) {
  win.insertAdjacentHTML("beforeend", `<img class="client" src="${shot.image}" alt="">`);
} else if (shot.home) {
  const frame = document.createElement("iframe");
  frame.className = "client";
  frame.src = "../../src/ui/home.html";
  frame.onload = () => {
    frame.contentWindow.render(shot.home);
    if (shot.hover) hover(frame.contentDocument, shot.hover);
  };
  win.append(frame);
} else {
  // The demo, stopped at its time, without its own (macOS-style) title bar: the window has one.
  fetch("../../docs/demo.svg").then(r => r.text()).then(text => {
    win.insertAdjacentHTML("beforeend", text);
    const svg = win.querySelector("svg");
    svg.classList.add("client");
    svg.setAttribute("viewBox", "0 35 940 627");   // 960 x 640: the demo's 940 width, scaled up to fit
    svg.querySelectorAll(":scope > rect, :scope > circle, :scope > .ttl").forEach(e => e.remove());
    svg.getAnimations({ subtree: true }).forEach(a => { a.pause(); a.currentTime = shot.demo * 1000; });
  });
}
</script>
</body>
</html>
