<!doctype html>
<!-- The Store's box art (1:1) and poster art (9:16), and its app tile icon: render.ps1 loads this page at each size,
     once per language. The hash names the language, with .tile and its size in pixels for the icon alone: en, en.tile.300.
     Everything else is sized from the shorter side, so one layout serves both arts. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
  html, body { width: 100vw; height: 100vh; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  /* The dots fade out from the edges toward the icon. */
  body::before { mask-image: radial-gradient(closest-side, transparent 35%, #000 100%); }

  img { position: relative; width: 52vmin; height: 52vmin; filter: drop-shadow(0 3vmin 6vmin rgba(0, 0, 0, 0.45)); }
  h1 { position: relative; margin: 6vmin 0 0; font-size: 11vmin; line-height: 1; font-weight: 700; letter-spacing: -0.02em; }
  p { position: relative; margin: 3vmin 0 0; font-size: 4.4vmin; font-weight: 500; color: rgba(255, 255, 255, 0.78); }

  /* .tile: the icon alone, filling a transparent square of --tile. */
  .tile body { background: transparent; }
  .tile body::before, .tile h1, .tile p { display: none; }
  /* In pixels: headless Edge keeps a minimum window size, larger than the tile, and shoots its top-left corner. */
  .tile img { position: fixed; left: 0; top: 0; width: var(--tile); height: var(--tile); filter: none; }
</style>
<script>
  const [language, part, size] = location.hash.slice(1).split(".");
  document.documentElement.lang = language;
  if (part === "tile") {
    document.documentElement.className = "tile";
    document.documentElement.style.setProperty("--tile", `${size}px`);
  }
</script>
</head>
<body>
  <img src="../../src/ui/icon.svg" alt="">
  <div>
    <h1>Zim<span class="brand">AI</span></h1>
    <p id="tagline"></p>
  </div>
  <script src="captions.js"></script>
  <script>document.getElementById("tagline").textContent = CAPTIONS[language].tagline;</script>
</body>
</html>
